name: CI/CD Pipeline (Build & Deploy ITX Test)

on:
  push:
    branches: [ "dev", "main", "master" ]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Descargar Código
        uses: actions/checkout@v4

      - name: 🐳 Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🛠️ Construir y Subir Imagen a Docker Hub
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            -t ${{ secrets.DOCKER_USERNAME }}/itx-frontend-test:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/itx-frontend-test:latest

  deploy-aws:
    needs: build-and-push 
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Desplegar en AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker stop itx-frontend || true
            docker rm itx-frontend || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/itx-frontend-test:latest
            docker run -d --name itx-frontend -p 80:80 ${{ secrets.DOCKER_USERNAME }}/itx-frontend-test:latest